name: CyanCalc checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyancalc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: .NET binding and desktop / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Select Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Verify upstream source and generated bindings
        run: |
          bash tools/cyancalc/fetch-source.sh
          python3 tools/cyancalc/sync-wasm-binding.py --check
      - name: Test native bridge
        run: cargo test --locked --manifest-path bindings/dotnet/native/Cargo.toml --lib
      - name: Restore and build libraries, desktop, and checks
        run: |
          dotnet restore CyanCalc.slnx --locked-mode
          dotnet build CyanCalc.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Run all public managed checks
        run: dotnet run --project tests/CyanCalc.CoreChecks --configuration Release --no-build --no-restore
      - name: Verify generated files and lockfiles stayed unchanged
        run: git diff --exit-code HEAD
